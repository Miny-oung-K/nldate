[project]
name = "nldate"
version = "0.1.0"
description = "Deterministic parser for common English date expressions"
readme = "README.md"
authors = [
    { name = "Miny-oung-K", email = "mik061@ucsd.edu" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.mypy]
strict = true
